[build-system]
build-backend = "uv_build"
requires = [
    "uv-build>=0.12.5,<0.13.0",
]

[project]
name = "sync-pre-commit-hooks"
version = "0.10.0"
description = "Some useful pre-commit hooks dependencies, etc."
readme = "README.md"
keywords = [
    "sync-pre-commit-hooks",
]
license = "NIST-PD"
license-files = [ "LICENSE" ]
authors = [
    { name = "William P. Krekelberg", email = "wpk@nist.gov" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # core dependencies
    "dependency-groups>=1.3.1",
    "packaging>=26.0",
    "requirements-parser>=0.13.0",
    "ruamel-yaml>=0.19.1",
    "tomli>=2.4.1; python_version<'3.11'",
    "tomlkit>=0.14.0",
    "typing-extensions>=4.15.0; python_version<'3.12'",
]

[project.optional-dependencies]
complete = [
    "sync-pre-commit-hooks[lastversion,uv]>=0.4.0",
]
lastversion = [
    "lastversion>=3.6.10",
]
uv = [ "uv" ]

[project.urls]
Documentation = "https://pages.nist.gov/sync-pre-commit-hooks/"
Homepage = "https://github.com/wpk-nist-gov/sync-pre-commit-hooks"

[project.scripts]
apply-command = "sync_pre_commit_hooks.apply_command:main"
fill-pre-commit-deps = "sync_pre_commit_hooks.fill_pre_commit_deps:main"
sync-pre-commit-deps = "sync_pre_commit_hooks.sync_pre_commit_deps:main"
sync-pre-commit-language-version = "sync_pre_commit_hooks.sync_pre_commit_language_version:main"
sync-uv-dependency-groups = "sync_pre_commit_hooks.sync_uv_dependency_groups:main"
sync-uv-build-deps = "sync_pre_commit_hooks.sync_uv_build_deps:main"
sync-pyproject-min-versions = "sync_pre_commit_hooks.sync_pyproject_min_versions:main"

[dependency-groups]
dev = [
    { include-group = "mypy" },
    { include-group = "nox" },
    { include-group = "test" },
    { include-group = "type" },
]
test = [
    "pytest-cov>=7.1.0",
    "pytest-sugar>=1.1.1",
    "pytest-xdist>=3.8.0",
    { include-group = "optional-dependencies" },
    { include-group = "pytest" },
]
type = [
    { include-group = "nox" },
    { include-group = "optional-dependencies" },
    { include-group = "pylint" },
    { include-group = "pytest" },
    { include-group = "typecheck-runner" },
]
# other groups
basedpyright = [ "basedpyright>=1.39.10" ]
ipython = [ "ipython" ]
mypy = [ "mypy[faster-cache]>=2.3.1" ]
nox = [ "nox>=2026.8.17" ]
optional-dependencies = [ "sync-pre-commit-hooks[lastversion]" ]
pylint = [ "pylint>=4.0.7" ]
pytest = [ "pytest>=9.1.1" ]
test-extras = [
    { include-group = "test" },
]
typecheck-runner = [ "typecheck-runner>=0.2.0; python_version>'3.9'" ]

# * uv -------------------------------------------------------------------------
[tool.uv]
required-version = ">=0.11.8"
default-groups = [ "dev" ]
fork-strategy = "requires-python"
exclude-newer = "7 days"
managed = true
build-backend.source-exclude = [ ".*cache" ]
build-backend.source-include = [ "tests/**" ]
pip.annotation-style = "line"
pip.generate-hashes = true

[tool.uv.dependency-groups]
dev.requires-python = ">=3.14"
ipython.requires-python = ">=3.14"
mypy.requires-python = ">=3.14"
nox.requires-python = ">=3.14"

# ruff -------------------------------------------------------------------------
[tool.ruff]
extend-include = [
    "*.ipynb",
]
extend-exclude = [
    ".numba_cache",
    ".venv",
    "dist-conda",
]
fix = true
# unsafe-fixes = true

[tool.ruff.format]
docstring-code-format = true
preview = true  # needed for markdown support

[tool.ruff.lint]
preview = true
select = [
    "ALL",
]
# fixable = [ "ALL" ]
unfixable = [
    "PLR6104",
    "ERA",
    "T",
]
ignore = [
    "ANN401",  # - Any ok sometimes
    "COM",     # - flake8-commas, formatter should take care of this?
    "CPY",     # - Don't require copyright
    "D105",    # - Missing magic method docstring
    "D107",    # - Missing docstring in __init__
    "D203",    # - 1 blank line required before class docstring
    "D205",    # - blank line after summary
    "D212",    # - Multi-line docstring summary should start at the first line
    "D400",    # - First line should end with a period
    "D401",    # - First line of docstring should be in imperative mood: "{first_line}"
    "DOC201",  # - Missing return from documentation
    "DOC501",  # - Missing raises from documentation
    "E501",    # - line too long - let formatter fix this
    "E731",    # - do not assign a lambda expression, use a def
    "FBT",     # - bools are ok
    "PLC0415", # - import should be at top level (leads to issues with imports in func?)
    "S404",    # - Want to use subprocess sometimes
    "S603",    # - subprocess-without-shell-equals-true
    "S607",    # - start-process-with-partial-path
    "TID252",  # - Allow relative imports
]
isort.known-first-party = [
    "sync_pre_commit_hooks",
]
pydocstyle.convention = "numpy"
pylint.max-args = 15
pylint.max-positional-args = 15
pylint.max-public-methods = 30
ruff.strictly-empty-init-modules = false

[tool.ruff.lint.per-file-ignores]
"src/**" = [
    "NPY", # - not using numpy?
    "PD",  # - not using pandas?
]
"tests/**" = [
    "D",      # - Don't need to document tests
    "S101",   # - Assert is fine with tests
    "SLF001",
]

# * Checks ---------------------------------------------------------------------
[tool.repo-review]
ignore = [
    "NOX103", # I prefer using "nox.options.sessions"
    "PC111",  # use doccmd instead of blacken-docs
    "PC140",  # do this externally
    "PC160",  # use typos
    "PC170",  # pygrep
    "PY004",  # no docs for this
]

[tool.check-wheel-contents]
src_dir = [ "src" ]
toplevel = [ "sync_pre_commit_hooks" ]

[tool.pyproject-fmt]
indent = 4
keep_full_version = true
# max_supported_python = "3.13"
expand_tables = [
    "project.entry-points",
    "project.optional-dependencies",
    "project.scripts",
    "project.urls",
    "tool.mypy.overrides",
    "tool.pyproject2conda",
    "tool.pyright.executionEnvironments",
    "tool.pytest",
    "tool.ruff.format",
    "tool.ruff.lint",
    "tool.ruff.lint.per-file-ignores",
    "tool.ty.overrides",
    "tool.typos",
    "tool.uv.dependency-groups",
    "tool.uv.exclude-newer-package",
]

[tool.typos.default.extend-identifiers]
CPY = "CPY"

# * typecheck ---------------------------------------------------------------------
[tool.mypy]
files = [
    "noxfile.py",
    "src",
    "tests",
    "tools",
]
# options
check_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [ "lastversion.*" ]
ignore_missing_imports = true

[tool.pyrefly]
enabled-ignores = [ "pyrefly" ]
project-includes = [
    "noxfile.py",
    "src",
    "tests",
    "tools",
]
search-path = [ "." ]

[tool.pyright]
typeCheckingMode = "strict"
# strict = [
#     "noxfile.py",
#     "src",
#     "tests",
#     "tools/*.py",
# ]
include = [
    "noxfile.py",
    "src",
    "tests",
    "tools",
]
exclude = [
    "**/.mypy_cache",
    "**/.numba_cache",
    "**/__pycache__",
    ".nox/**",
    ".tox/**",
    ".venv/**",
]
enableTypeIgnoreComments = false
deprecateTypingAliases = true
reportCallInDefaultInitializer = true
reportImplicitOverride = true
reportImplicitStringConcatenation = false
reportImportCycles = true
# options
# reportMissingSuperCall = true
reportOverlappingOverload = true
reportPrivateImportUsage = false
reportPrivateUsage = false
reportPropertyTypeMismatch = true
reportUninitializedInstanceVariable = true
reportUnnecessaryTypeIgnoreComment = true
reportUnreachable = "warning"
reportUntypedClassDecorator = true
reportUntypedFunctionDecorator = true
reportUnusedCallResult = true
reportUnusedImport = false
reportUnusedVariable = false
enableReachabilityAnalysis = false

[[tool.pyright.executionEnvironments]]
reportUnusedCallResult = false
root = "tests"

[tool.ty]
src.include = [
    "noxfile.py",
    "src",
    "tests",
    "tools",
]
analysis.respect-type-ignore-comments = false

# * Testing --------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = [
    "--cov-config=pyproject.toml",
    "--doctest-glob=*.md",
    "--doctest-modules",
    "--pyargs",
    "--strict-config",
    "--strict-markers",
    "-ra",
]
testpaths = [
    "README.md",
    "sync_pre_commit_hooks",
    "tests",
]
# options
filterwarnings = [ "error" ]
log_cli_level = "INFO"
log_level = "INFO"
minversion = "8"
strict_xfail = "true"

[tool.coverage]
run.source = [
    "sync_pre_commit_hooks",
]
run.branch = true
paths.source = [
    "src/",
    # needed for non editable doctests
    ".nox/**/site-packages/",
    "*/.nox/**/site-packages",
    "*/src",
]
report.include = [
    "src/*",
]
report.omit = [
    "*/_typing.py",
    "*/vendored/*",
]
report.exclude_also = [
    "@overload",
    'if __name__ == "__main__":',
    "if TYPE_CHECKING:",
]
report.show_missing = true

[tool.commitizen]
use_shortcuts = true

# * Dependency creation --------------------------------------------------------
[tool.pyproject2conda]
template-python = "requirements/py{py}-{env}"
template = "requirements/{env}"
name = "py{py}-{env}"
python = "default"
channels = "conda-forge"
style = "yaml"
conda-deps = "pip"

[tool.pyproject2conda.dependencies]
pytest-accept = { pip = true }

[tool.pyproject2conda.envs.dev]
groups = "dev"

[tool.pyproject2conda.envs.test]
groups = "test"
python = "all"

[tool.pyproject2conda.envs.test-extras]
groups = "test-extras"
python = "all"
skip-package = true

[tool.pyproject2conda.envs.uvx-tools]
pip-deps = [
    # these used solely for specking tools to be run via uvx ...
    "conda-lock>=4.0.2",
    "copier-template-extensions>=0.3.3",
    "copier>=9.17.1",
    "grayskull>=3.1.1",
    "prek>=0.4.14",
    "pyrefly>=1.2.0",
    "pyright>=1.1.411",
    "rooster>=0.1.1",
    "twine>=7.0.0",
    "ty>=0.0.72",
]
groups = [
    "basedpyright",
    "mypy",
    "nox",
    "typecheck-runner",
    # min versions
    "pylint",
    "pytest",
]
skip-package = true
style = "requirements"

[tool.uv-locker]
scripts = [
    "noxfile.py",
    "tools/cog_runner.py",
]

[[tool.uv-locker.requirements]]
path = "requirements/uvx-tools.txt"
output-file = "requirements/lock/uvx-tools.txt"
python = "min"
options = [
    "--no-deps",
    "--no-strip-extras",
    "--universal",
]

# * Other tools ----------------------------------------------------------------
[tool.rooster]
changelog_contributors = true
major-labels = [ "breaking" ]
minor_labels = [ "enhancement" ]
patch-labels = [ "bug", "documentation" ]
# options
ignore-labels = [ "internal" ]
require-labels = [ "breaking", "bug", "documentation", "enhancement" ]
version_files = [
    "pyproject.toml",
]
# sections
section-labels."Breaking changes" = [ "breaking" ]
section-labels."Bug fixes" = [ "bug" ]
section-labels.Documentation = [ "documentation" ]
section-labels.Enhancements = [ "enhancement" ]
section-labels.Internal = [ "internal" ]
section-labels."Other changes" = [ "__unknown__" ]
